wgx:
  apiVersion: v1
  requiredWgx: "^2.0.0"
  repoKind: node-service

  tooling:
    shell:
      default: bash
    node:
      packageManager: pnpm

  tasks:
    up: "corepack pnpm install --frozen-lockfile"

    smoke: |
      set -euo pipefail
      echo "[wgx.smoke] Installiere gepinnte Plexer-Abhängigkeiten (Corepack/pnpm)"
      corepack pnpm install --frozen-lockfile
      echo "[wgx.smoke] TypeScript-Build für plexer (Corepack/pnpm)"
      corepack pnpm run build
